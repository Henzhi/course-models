<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细菌 · 真菌 · 病毒 · 七上 · 生物</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1d2333; --ink2:#4b5468; --muted:#8b93a7;
    --line:#e3e6f0; --brand:#5b5bd6; --soft:#eeedfd;
    --warn:#a8461f; --warnbg:#fff5f0; --warnline:#f6d3c2;
    --shadow:0 1px 2px rgba(29,35,51,.05),0 10px 30px -20px rgba(29,35,51,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{padding:14px 24px 12px; background:#fff; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; gap:14px; font-size:13px}
  .back{
    color:var(--brand); text-decoration:none; font-weight:600;
    border:1px solid #dedcfb; background:var(--soft); border-radius:7px;
    padding:2px 10px; white-space:nowrap;
  }
  .back:hover{background:#e4e3fc}
  .crumb{font-size:13px; color:var(--muted); letter-spacing:.2px}
  h1{font-size:25px; font-weight:700; letter-spacing:-.3px; margin-top:1px}
  .sub{font-size:14px; color:var(--ink2); margin-top:3px}
  .tools{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .seg{display:inline-flex; background:#eef0f7; border-radius:10px; padding:3px}
  .seg button{
    border:0; background:transparent; font:inherit; font-size:14px; font-weight:500;
    color:var(--ink2); padding:6px 15px; border-radius:8px; cursor:pointer;
    transition:background .15s,color .15s;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(29,35,51,.13)}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 13px; font:inherit; font-size:13.5px; color:var(--ink2); cursor:pointer;
  }
  .ghost:hover{border-color:#c4c9dd; color:var(--ink)}
  .ghost.off{background:#f1f2f8; color:var(--muted)}
  main{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) 396px;
    grid-template-rows:minmax(0,1fr);
    gap:16px; padding:16px 20px 8px; min-height:0;
  }
  .canvas-wrap{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:6px; display:flex; min-height:0;
  }
  svg{width:100%; height:100%; display:block; min-height:0}
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:20px 20px 26px; overflow:auto; min-height:0;
  }
  .panel h3{font-size:21px; font-weight:700; letter-spacing:-.2px}
  .panel .en{display:block; font-size:12.5px; color:var(--muted); font-style:italic; margin-top:1px}
  .panel .tag{
    display:inline-block; font-size:12px; font-weight:600; color:var(--brand);
    background:var(--soft); border:1px solid #dedcfb; border-radius:6px;
    padding:1px 8px; margin-top:8px;
  }
  .p-sec{margin-top:18px}
  .p-sec h4{
    font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1.2px;
    margin-bottom:5px;
  }
  .p-sec p{font-size:16px; color:var(--ink2)}
  .p-sec.warn{
    background:var(--warnbg); border:1px solid var(--warnline);
    border-radius:10px; padding:12px 14px;
  }
  .p-sec.warn h4{color:var(--warn); letter-spacing:1px}
  .p-sec.warn p{color:#7d3617}
  .hero p.goal{
    font-size:16px; color:var(--ink2); margin-top:12px;
    background:#f7f7fe; border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0; padding:10px 14px;
  }
  .hero p.goal b{color:var(--ink)}
  .hero .tips{margin:16px 0 0 20px; font-size:14.5px; color:var(--ink2)}
  .hero .tips li{margin-bottom:6px}
  .keys{
    margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.9;
  }
  .keys span{display:inline-block; margin-right:12px; white-space:nowrap}
  .keys kbd{
    font-family:Consolas,monospace; font-size:11.5px; background:#f1f2f8;
    border:1px solid #dde0ec; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; color:var(--ink2);
  }
  .cmp{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px}
  .cmp th,.cmp td{border-bottom:1px solid var(--line); padding:5px 6px; text-align:left}
  .cmp th{font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.5px; padding-bottom:6px}
  .cmp td:first-child{font-weight:600; color:var(--ink)}
  .cmp .yes{color:#2f6b45}
  .cmp .no{color:#b9c0d0}
  footer{
    padding:6px 24px 14px; font-size:12.5px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  footer b{color:var(--ink2); font-weight:600}

  [data-part]{cursor:pointer; transition:opacity .18s}
  [data-part]:hover{opacity:.84}
  [data-part].dim{opacity:.13}
  body.has-sel [data-part]{opacity:.22}
  body.has-sel [data-part].sel{opacity:1}
  .lb text{pointer-events:none}
  svg.hide-lb .lb{display:none}

  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    main{grid-template-columns:1fr; grid-template-rows:minmax(280px,1fr) auto}
    .panel{max-height:330px}
    h1{font-size:21px}
  }
  @media print{
    header .tools,footer{display:none}
    body{background:#fff}
  }
</style>
</head>

    g.appendChild(mk("circle", {cx:to[0], cy:to[1], r:3.2, fill:"#7b8497"}));
    var t = mk("text", {
      x: from[0] + (L.anchor === "end" ? -5 : (L.anchor === "start" ? 5 : 0)),
      y: from[1],
      "font-size": L.size || 14,
      fill: "#3c465c",
      "text-anchor": L.anchor || "end",
      "dominant-baseline": "middle",
      "font-weight": 500
    });
    t.textContent = L.text;
    g.appendChild(t);
    svg.appendChild(g);
  });

  function clearSel(){
    document.body.classList.remove("has-sel");
    var on = svg.querySelectorAll(".sel");
    for(var i=0;i<on.length;i++) on[i].classList.remove("sel");
  }

  function markSel(id){
    clearSel();
    document.body.classList.add("has-sel");
    var ns = svg.querySelectorAll('[data-part="' + id + '"]');
    for(var i=0;i<ns.length;i++) ns[i].classList.add("sel");
  }

  function partById(id){
    for(var i=0;i<D.parts.length;i++){ if(D.parts[i].id === id) return D.parts[i]; }
    return null;
  }

  function renderPart(id){
    var p = partById(id);
    if(!p) return renderHero();
    var html = '<h3>' + p.name + '</h3>';
    if(p.en) html += '<span class="en">' + p.en + '</span>';
    if(p.only) html += '<span class="tag">' + p.only + '</span>';
    html += '<div class="p-sec"><h4>是什么</h4><p>' + p.desc + '</p></div>';
    html += '<div class="p-sec"><h4>作用</h4><p>' + p.role + '</p></div>';
    if(p.warn) html += '<div class="p-sec warn"><h4>易错点</h4><p>' + p.warn + '</p></div>';
    panel.innerHTML = html;
  }

  function renderHero(){
    var cmp = "";
    if(D.compare && D.compare.rows){
      var rows = D.compare.rows.map(function(r){
        var cells = r.slice(1).map(function(v){
          return '<td class="' + (v === "无" ? "no" : "yes") + '">' + v + "</td>";
        }).join("");
        return "<tr><td>" + r[0] + "</td>" + cells + "</tr>";
      }).join("");
      cmp = '<table class="cmp"><thead><tr>' +
        D.compare.head.map(function(h){ return "<th>" + h + "</th>"; }).join("") +
        "</tr></thead><tbody>" + rows + "</tbody></table>";
    }
    panel.innerHTML =
      '<h3>' + D.hero.title + '</h3>' +
      '<p class="goal">看完这一页，你要能说出：<b>' + D.hero.goal + '</b></p>' +
      '<ol class="tips">' + D.hero.tips.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>' +
      cmp +
      '<div class="keys">' +
        '<span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切模式</span>' +
        '<span><kbd>L</kbd> 隐藏标注</span>' +
        '<span><kbd>F</kbd> 全屏</span>' +
        '<span><kbd>Esc</kbd> 取消选择</span>' +
      '</div>';
  }

  function getGroups(){
    if(D.groups && D.groups.length) return D.groups;
    var g = [];
    if(D.same) g.push({ label:"共同结构", title:D.groupSame.title, lead:D.groupSame.lead,
      items:D.groupSame.items, tip:D.groupSame.tip, ids:D.same });
    if(D.diff) g.push({ label:"不同结构", title:D.groupDiff.title, lead:D.groupDiff.lead,
      items:D.groupDiff.items, tip:D.groupDiff.tip, ids:D.diff });
    return g;
  }

  function buildModeButtons(){
    var gs = getGroups();
    var h = '<button type="button" data-mode="all" class="on">全部结构</button>';
    gs.forEach(function(g, i){
      h += '<button type="button" data-mode="g' + i + '">' + g.label + '</button>';
    });
    document.getElementById("mode").innerHTML = h;
  }

  function renderGroupData(g){
    panel.innerHTML =
      '<h3>' + g.title + '</h3>' +
      '<p class="goal">' + g.lead + '</p>' +
      (g.items ? '<div class="p-sec"><h4>包含</h4><p>' + g.items + '</p></div>' : '') +
      (g.tip ? '<div class="p-sec warn"><h4>记法</h4><p>' + g.tip + '</p></div>' : '');
  }

  function applyDim(keep){
    var ns = svg.querySelectorAll("[data-part]");
    for(var i=0;i<ns.length;i++){
      var p = ns[i].getAttribute("data-part");
      var off = keep && keep.indexOf(p) < 0;
      ns[i].classList.toggle("dim", !!off);
    }
  }

  function setMode(m){
    mode = m;
    var btns = document.querySelectorAll("#mode button");
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === m);
    clearSel();
    if(m === "all"){ applyDim(null); renderHero(); return; }
    var g = getGroups()[+m.slice(1)];
    if(!g){ applyDim(null); renderHero(); return; }
    applyDim(g.ids);
    renderGroupData(g);
  }

  svg.addEventListener("click", function(e){
    var n = e.target.closest("[data-part]");
    if(!n){ clearSel(); renderHero(); return; }
    var id = n.getAttribute("data-part");
    markSel(id);
    renderPart(id);
  });

  var br = document.getElementById("mode");
  br.addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]");
    if(b) setMode(b.getAttribute("data-mode"));
  });

  var lbBtn = document.getElementById("btnLabel");
  lbBtn.addEventListener("click", function(){
    var off = svg.classList.toggle("hide-lb");
    lbBtn.classList.toggle("off", off);
    lbBtn.textContent = off ? "显示标注　L" : "隐藏标注　L";
  });

  var fullBtn = document.getElementById("btnFull");
  function toggleFull(){
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullBtn.addEventListener("click", toggleFull);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k >= "1" && k <= "9"){
      var idx = +k - 1;
      if(idx === 0) setMode("all");
      else if(idx - 1 < getGroups().length) setMode("g" + (idx - 1));
    }
    else if(k === "Escape"){ clearSel(); renderHero(); setMode("all"); }
    else if(k === "l" || k === "L") lbBtn.click();
    else if(k === "f" || k === "F") toggleFull();
  });

  buildModeButtons();
  setMode("all");

  window.__SELFTEST__ = function(){
    var errs = [];
    if(!D.parts || !D.parts.length) errs.push("parts 为空");
    if(!D.shapes || !D.shapes.length) errs.push("shapes 为空");
    var ids = {};
    (D.parts||[]).forEach(function(p){ ids[p.id] = 1; if(!p.name || !p.desc || !p.role) errs.push("部位字段缺失: " + p.id); });
    (D.shapes||[]).forEach(function(s){ if(s.part && !ids[s.part]) errs.push("shape 引用了未知部位: " + s.part); });
    (D.labels||[]).forEach(function(l){ if(!ids[l.p]) errs.push("label 引用了未知部位: " + l.p); });
    (D.same||[]).forEach(function(p){ if(!ids[p]) errs.push("same 引用了未知部位: " + p); });
    (D.diff||[]).forEach(function(p){ if(!ids[p]) errs.push("diff 引用了未知部位: " + p); });
    getGroups().forEach(function(g){
      (g.ids||[]).forEach(function(p){ if(!ids[p]) errs.push("分组「" + g.label + "」引用了未知部位: " + p); });
    });
    if(svg.querySelectorAll("[data-part]").length === 0) errs.push("SVG 没有渲染出任何部位");
    return errs;
  };

  if(!window.__QUIET__){
    var e = window.__SELFTEST__();
    if(e.length) console.log("SELFTEST FAIL: " + e.join(" | "));
    else console.log("SELFTEST PASS");
  }
})();
</script>
</body>
</html>
