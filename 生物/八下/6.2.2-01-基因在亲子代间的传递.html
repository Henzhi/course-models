<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基因在亲子代间的传递 · 八下 · 生物</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1d2333; --ink2:#4b5468; --muted:#8b93a7;
    --line:#e3e6f0; --brand:#5b5bd6; --soft:#eeedfd;
    --warn:#a8461f; --warnbg:#fff5f0; --warnline:#f6d3c2;
    --ok:#2f6b45; --okbg:#eef7f1; --okline:#cbe5d5;
    --shadow:0 1px 2px rgba(29,35,51,.05),0 10px 30px -20px rgba(29,35,51,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header{padding:14px 24px 12px; background:#fff; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; gap:14px; font-size:13px}
  .back{
    color:var(--brand); text-decoration:none; font-weight:600;
    border:1px solid #dedcfb; background:var(--soft); border-radius:7px;
    padding:2px 10px; white-space:nowrap;
  }
  .back:hover{background:#e4e3fc}
  .crumb{font-size:13px; color:var(--muted); letter-spacing:.2px}
  h1{font-size:25px; font-weight:700; letter-spacing:-.3px; margin-top:1px}
  .sub{font-size:14px; color:var(--ink2); margin-top:3px}
  .tools{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 13px; font:inherit; font-size:13.5px; color:var(--ink2); cursor:pointer;
  }
  .ghost:hover{border-color:#c4c9dd; color:var(--ink)}
  .ghost.off{background:#f1f2f8; color:var(--muted)}
  main{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) 408px;
    grid-template-rows:minmax(0,1fr);
    gap:16px; padding:16px 20px 8px; min-height:0;
  }
  .canvas-wrap{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:6px; display:flex; min-height:0;
  }
  svg{width:100%; height:100%; display:block; min-height:0}
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:18px 20px 24px; overflow:auto; min-height:0;
  }
  .panel h3{font-size:20px; font-weight:700; letter-spacing:-.2px}
  .panel .step-no{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    background:var(--brand); border-radius:6px; padding:1px 8px; margin-right:7px;
    vertical-align:2px;
  }
  .panel .en{display:block; font-size:12.5px; color:var(--muted); font-style:italic; margin-top:1px}
  .panel .tag{
    display:inline-block; font-size:12px; font-weight:600; color:var(--brand);
    background:var(--soft); border:1px solid #dedcfb; border-radius:6px;
    padding:1px 8px; margin-top:7px;
  }
  .goal{
    font-size:16px; color:var(--ink2); margin-top:11px;
    background:#f7f7fe; border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0; padding:10px 13px;
  }
  .goal b{color:var(--ink)}
  .p-sec{margin-top:14px}
  .p-sec h4{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1.2px; margin-bottom:4px}
  .p-sec p{font-size:16px; color:var(--ink2)}
  .p-sec.warn{background:var(--warnbg); border:1px solid var(--warnline); border-radius:10px; padding:11px 14px}
  .p-sec.warn h4{color:var(--warn)}
  .p-sec.warn p{color:#7d3617}
  .p-sec.ok{background:var(--okbg); border:1px solid var(--okline); border-radius:10px; padding:11px 14px}
  .p-sec.ok h4{color:var(--ok)}
  .p-sec.ok p{color:#2a5c40}
  .ctrl{border-top:1px dashed var(--line); padding-top:13px; margin-top:14px}
  .ctrl:first-of-type{border-top:0; padding-top:0; margin-top:10px}
  .ctrl .lab{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1px; margin-bottom:7px}
  .steps{display:flex; gap:6px; flex-wrap:wrap}
  .steps button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:5px 10px; font:inherit; font-size:13px; color:var(--ink2); cursor:pointer;
    white-space:nowrap;
  }
  .steps button:hover{border-color:#c4c9dd}
  .steps button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:700}
  .stepnav{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 2px}
  .stepnav button{
    width:40px; height:34px; border:1px solid var(--line); background:#fff; border-radius:8px;
    font:inherit; font-size:14px; font-weight:600; color:var(--ink2); cursor:pointer;
  }
  .stepnav button:hover{border-color:#c4c9dd}
  .stepnav button.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .btns{display:flex; gap:7px; flex-wrap:wrap}
  .btns button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:6px 13px; font:inherit; font-size:14px; color:var(--ink2); cursor:pointer;
  }
  .btns button:hover{border-color:#c4c9dd}
  .btns button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:600}
  .stats{display:flex; gap:8px; margin-top:12px}
  .stat{
    flex:1; background:#f7f8fc; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; text-align:center;
  }
  .stat b{display:block; font-size:20px; line-height:1.3; font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px; color:var(--muted)}
  .stat.hi{background:#f2effe; border-color:#d9d3fa}
  .stat.hi b{color:var(--brand)}
  .legend{display:flex; flex-wrap:wrap; gap:7px 14px}
  .legend .lg{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink2)}
  .legend .lg i{width:12px; height:6px; border-radius:3px; display:inline-block; flex:none}
  .cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  .cmp th,.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
  .cmp th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;padding-bottom:7px}
  .cmp td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
  .cmp td{color:var(--ink2)}
  .keys{
    margin-top:16px; padding-top:13px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.9;
  }
  .keys span{display:inline-block; margin-right:12px; white-space:nowrap}
  .keys kbd{
    font-family:Consolas,monospace; font-size:11.5px; background:#f1f2f8;
    border:1px solid #dde0ec; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; color:var(--ink2);
  }
  footer{
    padding:6px 24px 14px; font-size:12.5px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  footer b{color:var(--ink2); font-weight:600}

  [data-part]{cursor:pointer; transition:opacity .18s}
  [data-part]:hover{opacity:.86}
  svg.hide-lb .lb{display:none}
  .cap text{pointer-events:none}

  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    main{grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) auto}
    .panel{max-height:350px}
    h1{font-size:21px}
  }
</style>
</head>

700,"part":"gene","lbl":true},{"t":"text","x":708,"y":286,"tx":"a","size":14,"fill":"#c0504d","anchor":"middle","weight":700,"part":"gene","lbl":true}],"routes":[{"id":"r_dad","color":"#3f66c8","w":10,"speed":0.9,"pts":[[252,140],[310,138],[370,140],[430,140]]},{"id":"r_mom","color":"#c0504d","w":10,"speed":0.9,"pts":[[252,480],[306,482],[362,480],[410,480]]},{"id":"r_fert1","color":"#3f66c8","w":9,"speed":0.8,"pts":[[500,168],[556,196],[630,232],[688,258]]},{"id":"r_fert2","color":"#c0504d","w":9,"speed":0.8,"pts":[[512,436],[572,420],[646,398],[700,382]]},{"id":"r_off","color":"#7a9b5e","w":9,"speed":0.7,"pts":[[730,404],[730,452],[730,496]]}],"steps":[{"name":"基因坐在染色体上","say":"先看清「东西放在哪」——基因不是飘在细胞里的，它坐在染色体上。","stats":[{"v":"4","label":"体细胞染色体（2 对）"}],"ask":"数一数左上那个细胞里有几根染色体？为什么是 4 根、不是 2 根？","note":"<b>体细胞里染色体成对存在，基因也成对存在。</b>一根来自父方、一根来自母方，配成一对。染色体由 DNA 和蛋白质组成，基因是有遗传效应的 DNA 片段。","parts":["dadcell","momcell","chrom","gene"],"routes":[],"caption":"染色体成对存在 → 基因也成对存在"},{"name":"形成生殖细胞：每对只走一条","say":"形成精子或卵细胞时，每一对染色体只挑一条进去——所以染色体数目减半。","stats":[{"v":"2","label":"精子 / 卵细胞（每对一条）"}],"ask":"4 根变成 2 根，少的那两根去哪了？如果这一步不减半，会出什么问题？","note":"<b>每对染色体各有一条进入生殖细胞</b>，所以精子、卵细胞的染色体数是体细胞的一半，基因也随之减半（成单，不再成对）。","parts":["dadcell","momcell","sperm","egg","chrom"],"routes":["r_dad","r_mom"],"caption":"减半：4 → 2，且这 2 条互不成对"},{"name":"受精：两半合成一份","say":"精子与卵细胞结合成受精卵，两半合在一起，染色体的数目又恢复成对。","stats":[{"v":"4","label":"受精卵（2 对，父母各 2）"}],"ask":"受精卵里的 4 根染色体，哪两根算「一对」？看颜色。","note":"<b>受精卵中成对的染色体，一条来自父方、一条来自母方。</b>注意数目：不是 46 + 46 = 92，而是 23 + 23 = 46，<b>与体细胞相同</b>。","parts":["sperm","egg","zygote","chrom","gene"],"routes":["r_fert1","r_fert2"],"caption":"恢复成对：2 + 2 = 4（不是 2 × 2 = 4）"},{"name":"桥的两头：传的是基因","say":"整条路上，真正把东西送过去的是精子和卵细胞。","stats":[{"v":"基因","label":"传下去的东西"},{"v":"精子·卵细胞","label":"传递的桥梁"}],"ask":"父母把「双眼皮」直接传给孩子了吗？还是传了别的东西？","note":"<b>亲代传给子代的是基因，不是性状。</b>性状是基因在子代身上重新表达出来的结果。精子和卵细胞就是基因在亲子代间传递的<b>桥梁</b>。","parts":["sperm","egg","zygote","offspring"],"routes":["r_dad","r_mom","r_fert1","r_fe   var panel = document.getElementById("panel");
  var S = { step:0, t:0, playing:true, sel:null };

  svg.setAttribute("viewBox", "0 0 " + D.canvas.w + " " + D.canvas.h);

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    if(a){ for(var k in a){ if(a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); } }
    return e;
  }
  function r1(v){ return Math.round(v * 10) / 10; }

  // Catmull-Rom -> 三次贝塞尔，把折线点变成平滑路径（保证穿过每个控制点）
  function smoothPath(pts, close){
    if(!pts || pts.length < 2) return "";
    var d = "M " + pts[0][0] + " " + pts[0][1];
    var n = pts.length;
    var lim = close ? n : n - 1;
    for(var i=0;i<lim;i++){
      var p0 = pts[(i - 1 + n) % n] || pts[i];
      var p1 = pts[i];
      var p2 = pts[(i + 1) % n];
      var p3 = pts[(i + 2) % n] || p2;
      if(!close){
        p0 = pts[i - 1] || pts[i];
        p3 = pts[i + 2] || p2;
      }
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += " C " + r1(c1x) + " " + r1(c1y) + " " + r1(c2x) + " " + r1(c2y)
         + " " + p2[0] + " " + p2[1];
    }
    if(close) d += " Z";
    return d;
  }

  function shape(s){
    var node = null;
    if(s.t === "g"){
      node = mk("g", null);
      (s.items || []).forEach(function(c){ var n = shape(c); if(n) node.appendChild(n); });
      return node;
    }
    if(s.pts){
      var d = s.smooth === false
        ? "M " + s.pts.map(function(p){ return p[0] + " " + p[1]; }).join(" L ")
        : smoothPath(s.pts, !!s.close);
      node = mk("path", {d:d, fill:s.fill || "none", stroke:s.stroke || "none",
        "stroke-width":s.sw || 0, "stroke-linecap":"round", "stroke-linejoin":"round"});
      if(s.close && !s.fill) node.setAttribute("fill", "none");
      return node;
    }
    if(s.t === "rect"){
      node = mk("rect", {x:s.x, y:s.y, width:s.w, height:s.h, rx:s.rx || 0,
        fill:s.fill || "none", stroke:s.stroke || "none", "stroke-width":s.sw || 0});
      if(s.rot) node.setAttribute("transform", "rotate(" + s.rot + " " + (s.x + s.w/2) + " " + (s.y + s.h/2) + ")");
    } else if(s.t === "ellipse"){
      node = mk("ellipse", {cx:s.cx, cy:s.cy, rx:s.rx, ry:s.ry,
        fill:s.fill || "none", stroke:s.stroke || "none", "stroke-width":s.sw || 0});
      if(s.rot) node.setAttribute("transform", "rotate(" + s.rot + " " + s.cx + " " + s.cy + ")");
    } else if(s.t === "circle"){
      node = mk("circle", {cx:s.cx, cy:s.cy, r:s.r,
        fill:s.fill || "none", stroke:s.stroke || "none", "stroke-width":s.sw || 0});
    } else if(s.t === "path"){
      node = mk("path", {d:s.d, fill:s.fill || "none", stroke:s.stroke || "none",
        "stroke-width":s.sw || 0, "stroke-linecap":"round", "stroke-linejoin":"round"});
    } else if(s.t === "line"){
      node = mk("line", {x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2,
        stroke:s.stroke || "none", "stroke-width":s.sw || 1,
        "stroke-dasharray":s.dash || null, "stroke-linecap":"round"});
    } else if(s.t === "text"){
      node = mk("text", {x:s.x, y:s.y, "font-size":s.size || 15, fill:s.fill || "#1d2333",
        "text-anchor":s.anchor || "middle", "dominant-baseline":"middle",
        "font-weight":s.weight || 400});
      node.textContent = s.tx;
    }
    if(node && s.op !== undefined) node.setAttribute("opacity", s.op);
    return node;
  }

  var routeEls = {};
  var flow = [];
  var flowLayer = null;
  var capG = null;

  function build(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    routeEls = {};
    flow = [];

    var base = mk("g", null);
    (D.shapes || []).forEach(function(s){
      var n = shape(s);
      if(!n) return;
      if(s.part) n.setAttribute("data-part", s.part);
      if(s.lbl) n.setAttribute("class", "lb");
      base.appendChild(n);
    });
    svg.appendChild(base);

    var tube = mk("g", null);
    (D.routes || []).forEach(function(rt){
      var d = smoothPath(rt.pts, false);
      var under = mk("path", {d:d, fill:"none", stroke:rt.color, "stroke-width":rt.w + 9,
        "stroke-linecap":"round", "stroke-linejoin":"round", opacity:0.18});
      var core = mk("path", {d:d, fill:"none", stroke:rt.color, "stroke-width":rt.w,
        "stroke-linecap":"round", "stroke-linejoin":"round", opacity:0.42});
      under.setAttribute("data-route", rt.id);
      core.setAttribute("data-route", rt.id);
      if(rt.part) core.setAttribute("data-hit", rt.part);
      tube.appendChild(under);
      tube.appendChild(core);
      routeEls[rt.id] = core;
    });
    svg.appendChild(tube);

    flowLayer = mk("g", null);
    svg.appendChild(flowLayer);

    (D.labels || []).forEach(function(L){
      var g = mk("g", {"class":"lb"});
      if(L.p) g.setAttribute("data-part", L.p);
      var ln = mk("line", {x1:L.from[0], y1:L.from[1], x2:L.to[0], y2:L.to[1],
        stroke:"#a4acc0", "stroke-width":1, "stroke-dasharray":"3 3"});
      g.appendChild(ln);
      g.appendChild(mk("circle", {cx:L.to[0], cy:L.to[1], r:3.2, fill:"#7b8497"}));
      var t = mk("text", {
        x:L.from[0] + (L.anchor === "end" ? -5 : 5), y:L.from[1],
        "font-size":L.size || 14, fill:"#3c465c", "text-anchor":L.anchor || "end",
        "dominant-baseline":"middle", "font-weight":500
      });
      t.textContent = L.text;
      g.appendChild(t);
      svg.appendChild(g);
    });

    // 底部图注层必须最后重建，否则会被上面的清空逻辑带走
    capG = mk("g", {"class":"cap"});
    svg.appendChild(capG);
  }

  function activeRoutes(){
    var st = D.steps[S.step];
    return (st && st.routes) ? st.routes : [];
  }

  function buildFlow(){
    flow = [];
    if(flowLayer){ flowLayer.innerHTML = ""; }
    var on = activeRoutes();
    (D.routes || []).forEach(function(rt){
      var core = routeEls[rt.id];
      if(!core) return;
      var isOn = on.indexOf(rt.id) >= 0;
      var ids = svg.querySelectorAll('[data-route="' + rt.id + '"]');
      for(var i=0;i<ids.length;i++){
        var offOp = (rt.off === undefined || rt.off === null) ? 0.14 : rt.off;
        ids[i].setAttribute("opacity", isOn ? (i === 0 ? 0.26 : 0.95) : offOp);
      }
      if(!isOn) return;
      var len = core.getTotalLength();
      if(!len || len < 2) return;
      var n = Math.max(3, Math.min(11, Math.round(len / 78)));
      for(var j=0;j<n;j++){
        var c = mk("circle", {r:4.4, fill:"#ffffff", stroke:rt.color, "stroke-width":2.4, opacity:0.96});
        flowLayer.appendChild(c);
        flow.push({el:c, path:core, len:len, phase:j / n, speed:rt.speed || 0.9});
      }
    });
  }

  function tick(){
    S.t += 0.0075;
    if(S.t > 1000) S.t = 0;
    if(!S.playing) return;
    for(var i=0;i<flow.length;i++){
      var f = flow[i];
      var p = (S.t * f.speed + f.phase) % 1;
      var pt = f.path.getPointAtLength(p * f.len);
      f.el.setAttribute("cx", r1(pt.x));
      f.el.setAttribute("cy", r1(pt.y));
    }
  }

  function partById(id){
    for(var i=0;i<(D.parts || []).length;i++){ if(D.parts[i].id === id) return D.parts[i]; }
    return null;
  }

  function stepsNav(){
    return '<div class="stepnav">'
      + D.steps.map(function(st, i){
          return '<button type="button" data-go="' + i + '" title="' + st.name + '" class="'
            + (S.step === i ? "on" : "") + '">' + (i + 1) + '</button>';
        }).join("")
      + '</div>';
  }

  function controls(){
    return '<div class="ctrl"><div class="lab">播放</div><div class="btns">'
      + '<button type="button" id="btnPlay" class="' + (S.playing ? "on" : "") + '">'
      + (S.playing ? "⏸ 暂停流动" : "▶ 播放流动") + '</button>'
      + '<button type="button" id="btnPrev">上一步</button>'
      + '<button type="button" id="btnNext">下一步</button>'
      + '</div></div>';
  }

  function legendHtml(){
    if(!D.legend || !D.legend.length) return "";
    return '<div class="ctrl"><div class="lab">图例</div><div class="legend">'
      + D.legend.map(function(x){
          return '<span class="lg"><i style="background:' + x.color + '"></i>' + x.text + '</span>';
        }).join("")
      + '</div></div>';
  }

  function renderPart(id){
    var p = partById(id);
    if(!p) return;
    var h = '<h3>' + p.name + '</h3>';
    if(p.en) h += '<span class="en">' + p.en + '</span>';
    if(p.only) h += '<span class="tag">' + p.only + '</span>';
    h += '<div class="p-sec"><h4>是什么</h4><p>' + p.desc + '</p></div>';
    h += '<div class="p-sec"><h4>作用</h4><p>' + p.role + '</p></div>';
    if(p.warn) h += '<div class="p-sec warn"><h4>易错点</h4><p>' + p.warn + '</p></div>';
    h += '<div class="ctrl"><div class="btns"><button type="button" id="btnBack">← 回到第 '
      + (S.step + 1) + ' 步</button></div></div>';
    panel.innerHTML = h;
  }

  function renderStep(){
    var st = D.steps[S.step];
    var h = '<h3><span class="step-no">' + (S.step + 1) + '</span>' + st.name + '</h3>'
      + stepsNav();
    if(st.say) h += '<p class="goal">' + st.say + '</p>';
    if(st.stats && st.stats.length){
      h += '<div class="stats">' + st.stats.map(function(x, i){
        return '<div class="stat' + (i === 0 ? " hi" : "") + '"><b>' + x.v + '</b><span>' + x.label + '</span></div>';
      }).join("") + '</div>';
    }
    if(st.ask) h += '<div class="p-sec"><h4>观察提示</h4><p>' + st.ask + '</p></div>';
    if(st.note) h += '<div class="p-sec warn"><h4>关键结论</h4><p>' + st.note + '</p></div>';
    if(st.table && st.table.head && st.table.rows){
      h += '<table class="cmp"><thead><tr>'
        + st.table.head.map(function(x){ return '<th>' + x + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + st.table.rows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('')
        + '</tbody></table>';
    }
    h += controls() + legendHtml();
    h += '<div class="keys"><span><kbd>空格</kbd> 暂停/播放</span>'
      + '<span><kbd>←</kbd><kbd>→</kbd> 切换步骤</span>'
      + '<span><kbd>1</kbd>–<kbd>' + D.steps.length + '</kbd> 跳步</span>'
      + '<span><kbd>L</kbd> 标注</span><span><kbd>F</kbd> 全屏</span></div>';
    panel.innerHTML = h;
  }

  function applyStep(){
    var st = D.steps[S.step];
    var keep = st.parts || null;
    var hide = st.hide || [];
    var ns = svg.querySelectorAll("[data-part]");
    for(var i=0;i<ns.length;i++){
      var p = ns[i].getAttribute("data-part");
      var op = (keep && keep.indexOf(p) < 0) ? 0.32 : 1;
      if(hide.indexOf(p) >= 0) op = 0;   // hide 里的部分本步完全不出现
      ns[i].setAttribute("opacity", op);
    }
    var cap = capG;
    if(cap){
      while(cap.firstChild) cap.removeChild(cap.firstChild);
      if(st.caption){
        var t = mk("text", {x:D.canvas.w / 2, y:D.canvas.h - 22, "font-size":13.5,
          fill:"#6b7488", "text-anchor":"middle"});
        t.textContent = st.caption;
        cap.appendChild(t);
      }
    }
  }

  function go(i){
    S.step = Math.max(0, Math.min(D.steps.length - 1, i));
    S.sel = null;
    build();
    buildFlow();
    applyStep();
    renderStep();
  }

  function setPlaying(v){
    S.playing = v;
    var b = document.getElementById("btnPlay");
    if(b){ b.classList.toggle("on", v); b.textContent = v ? "⏸ 暂停流动" : "▶ 播放流动"; }
  }

  panel.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    if(b.hasAttribute("data-go")){ go(+b.getAttribute("data-go")); return; }
    if(b.id === "btnPlay"){ setPlaying(!S.playing); return; }
    if(b.id === "btnPrev"){ go(S.step - 1); return; }
    if(b.id === "btnNext"){ go(S.step + 1); return; }
    if(b.id === "btnBack"){ S.sel = null; renderStep(); return; }
  });

  svg.addEventListener("click", function(e){
    var n = e.target.closest("[data-part],[data-hit]");
    if(!n){ return; }
    S.sel = n.getAttribute("data-part") || n.getAttribute("data-hit");
    renderPart(S.sel);
  });

  var lbBtn = document.getElementById("btnLabel");
  lbBtn.addEventListener("click", function(){
    var off = svg.classList.toggle("hide-lb");
    lbBtn.classList.toggle("off", off);
    lbBtn.textContent = off ? "显示标注　L" : "隐藏标注　L";
  });

  var fullBtn = document.getElementById("btnFull");
  function toggleFull(){
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullBtn.addEventListener("click", toggleFull);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k === " "){ e.preventDefault(); setPlaying(!S.playing); }
    else if(k === "ArrowRight" || k === "ArrowDown"){ e.preventDefault(); go(S.step + 1); }
    else if(k === "ArrowLeft" || k === "ArrowUp"){ e.preventDefault(); go(S.step - 1); }
    else if(k === "Escape" || k === "Backspace"){ S.sel = null; renderStep(); }
    else if(k === "l" || k === "L"){ lbBtn.click(); }
    else if(k === "f" || k === "F"){ toggleFull(); }
    else if(k >= "1" && k <= "9"){
      var idx = +k - 1;
      if(idx < D.steps.length) go(idx);
    }
  });

  go(0);
  setInterval(tick, 30);

  window.__SELFTEST__ = function(){
    var errs = [];
    var W = D.canvas.w, H = D.canvas.h;
    if(!D.steps || D.steps.length < 3) errs.push("步骤应不少于 3 步");
    if(!D.routes || !D.routes.length) errs.push("routes 为空");
    if(!D.parts || !D.parts.length) errs.push("parts 为空");

    var ids = {}, rids = {};
    (D.parts || []).forEach(function(p){
      ids[p.id] = 1;
      if(!p.name || !p.desc || !p.role) errs.push("部位字段缺失: " + p.id);
    });
    (D.routes || []).forEach(function(rt){
      if(rids[rt.id]) errs.push("route id 重复: " + rt.id);
      rids[rt.id] = 1;
      if(!rt.color) errs.push("route 缺少颜色: " + rt.id);
      if(!rt.pts || rt.pts.length < 2) errs.push("route 控制点不足: " + rt.id);
      (rt.pts || []).forEach(function(pt){
        if(pt[0] < 0 || pt[0] > W || pt[1] < 0 || pt[1] > H){
          errs.push("route「" + rt.id + "」有点跑出画布: " + pt[0] + "," + pt[1]);
        }
      });
    });
    (D.shapes || []).forEach(function(s){
      if(s.part && !ids[s.part]) errs.push("shape 引用了未知部位: " + s.part);
    });
    (D.labels || []).forEach(function(l){
      if(l.p && !ids[l.p]) errs.push("label 引用了未知部位: " + l.p);
    });
    D.steps.forEach(function(st, i){
      if(!st.name) errs.push("步骤缺少名称: " + (i + 1));
      (st.routes || []).forEach(function(rid){
        if(!rids[rid]) errs.push("步骤「" + st.name + "」引用了未知路径: " + rid);
      });
      (st.parts || []).forEach(function(pid){
        if(!ids[pid]) errs.push("步骤「" + st.name + "」引用了未知部位: " + pid);
      });
    });
    // 路径必须真的渲染出长度（防退化成一个点）
    Object.keys(routeEls).forEach(function(k){
      var el = routeEls[k];
      if(!el) return;
      var L = el.getTotalLength();
      if(!L || L < 60) errs.push("路径「" + k + "」长度异常: " + Math.round(L || 0));
    });
    if(flow.length === 0 && S.step > 0 && D.steps[S.step].routes && D.steps[S.step].routes.length){
      errs.push("当前步骤配置了路径却没有流动粒子");
    }
    var anyFlow = false;
    D.steps.forEach(function(st){ if(st.routes && st.routes.length) anyFlow = true; });
    if(!anyFlow) errs.push("没有任何步骤配置流动路径");
    if(svg.querySelectorAll("[data-part]").length === 0) errs.push("没有渲染出任何部位");
    return errs;
  };

  if(!window.__QUIET__){
    var e = window.__SELFTEST__();
    if(e.length) console.log("SELFTEST FAIL: " + e.join(" | "));
    else console.log("SELFTEST PASS");
  }
})();
</script>
</body>
</html>
