<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传染病及其预防 · 八上 · 生物</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1d2333; --ink2:#4b5468; --muted:#8b93a7;
    --line:#e3e6f0; --brand:#5b5bd6; --soft:#eeedfd;
    --warn:#a8461f; --warnbg:#fff5f0; --warnline:#f6d3c2;
    --ok:#2f6b45; --okbg:#eef7f1; --okline:#cbe5d5;
    --shadow:0 1px 2px rgba(29,35,51,.05),0 10px 30px -20px rgba(29,35,51,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header{padding:14px 24px 12px; background:#fff; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; gap:14px; font-size:13px}
  .back{
    color:var(--brand); text-decoration:none; font-weight:600;
    border:1px solid #dedcfb; background:var(--soft); border-radius:7px;
    padding:2px 10px; white-space:nowrap;
  }
  .back:hover{background:#e4e3fc}
  .crumb{font-size:13px; color:var(--muted); letter-spacing:.2px}
  h1{font-size:25px; font-weight:700; letter-spacing:-.3px; margin-top:1px}
  .sub{font-size:14px; color:var(--ink2); margin-top:3px}
  .tools{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 13px; font:inherit; font-size:13.5px; color:var(--ink2); cursor:pointer;
  }
  .ghost:hover{border-color:#c4c9dd; color:var(--ink)}
  .ghost.off{background:#f1f2f8; color:var(--muted)}
  main{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) 408px;
    grid-template-rows:minmax(0,1fr);
    gap:16px; padding:16px 20px 8px; min-height:0;
  }
  .canvas-wrap{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:6px; display:flex; min-height:0;
  }
  svg{width:100%; height:100%; display:block; min-height:0}
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:18px 20px 24px; overflow:auto; min-height:0;
  }
  .panel h3{font-size:20px; font-weight:700; letter-spacing:-.2px}
  .panel .step-no{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    background:var(--brand); border-radius:6px; padding:1px 8px; margin-right:7px;
    vertical-align:2px;
  }
  .panel .en{display:block; font-size:12.5px; color:var(--muted); font-style:italic; margin-top:1px}
  .panel .tag{
    display:inline-block; font-size:12px; font-weight:600; color:var(--brand);
    background:var(--soft); border:1px solid #dedcfb; border-radius:6px;
    padding:1px 8px; margin-top:7px;
  }
  .goal{
    font-size:16px; color:var(--ink2); margin-top:11px;
    background:#f7f7fe; border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0; padding:10px 13px;
  }
  .goal b{color:var(--ink)}
  .p-sec{margin-top:14px}
  .p-sec h4{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1.2px; margin-bottom:4px}
  .p-sec p{font-size:16px; color:var(--ink2)}
  .p-sec.warn{background:var(--warnbg); border:1px solid var(--warnline); border-radius:10px; padding:11px 14px}
  .p-sec.warn h4{color:var(--warn)}
  .p-sec.warn p{color:#7d3617}
  .p-sec.ok{background:var(--okbg); border:1px solid var(--okline); border-radius:10px; padding:11px 14px}
  .p-sec.ok h4{color:var(--ok)}
  .p-sec.ok p{color:#2a5c40}
  .ctrl{border-top:1px dashed var(--line); padding-top:13px; margin-top:14px}
  .ctrl:first-of-type{border-top:0; padding-top:0; margin-top:10px}
  .ctrl .lab{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1px; margin-bottom:7px}
  .steps{display:flex; gap:6px; flex-wrap:wrap}
  .steps button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:5px 10px; font:inherit; font-size:13px; color:var(--ink2); cursor:pointer;
    white-space:nowrap;
  }
  .steps button:hover{border-color:#c4c9dd}
  .steps button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:700}
  .stepnav{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 2px}
  .stepnav button{
    width:40px; height:34px; border:1px solid var(--line); background:#fff; border-radius:8px;
    font:inherit; font-size:14px; font-weight:600; color:var(--ink2); cursor:pointer;
  }
  .stepnav button:hover{border-color:#c4c9dd}
  .stepnav button.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .btns{display:flex; gap:7px; flex-wrap:wrap}
  .btns button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:6px 13px; font:inherit; font-size:14px; color:var(--ink2); cursor:pointer;
  }
  .btns button:hover{border-color:#c4c9dd}
  .btns button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:600}
  .stats{display:flex; gap:8px; margin-top:12px}
  .stat{
    flex:1; background:#f7f8fc; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; text-align:center;
  }
  .stat b{display:block; font-size:20px; line-height:1.3; font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px; color:var(--muted)}
  .stat.hi{background:#f2effe; border-color:#d9d3fa}
  .stat.hi b{color:var(--brand)}
  .legend{display:flex; flex-wrap:wrap; gap:7px 14px}
  .legend .lg{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink2)}
  .legend .lg i{width:12px; height:6px; border-radius:3px; display:inline-block; flex:none}
  .cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  .cmp th,.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
  .cmp th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;padding-bottom:7px}
  .cmp td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
  .cmp td{color:var(--ink2)}
  .keys{
    margin-top:16px; padding-top:13px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.9;
  }
  .keys span{display:inline-block; margin-right:12px; white-space:nowrap}
  .keys kbd{
    font-family:Consolas,monospace; font-size:11.5px; background:#f1f2f8;
    border:1px solid #dde0ec; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; color:var(--ink2);
  }
  footer{
    padding:6px 24px 14px; font-size:12.5px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  footer b{color:var(--ink2); font-weight:600}

  [data-part]{cursor:pointer; transition:opacity .18s}
  [data-part]:hover{opacity:.86}
  svg.hide-lb .lb{display:none}
  .cap text{pointer-events:none}

  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    main{grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) auto}
    .panel{max-height:350px}
    h1{font-size:21px}
  }
</style>
</head>

  <h1>传染病及其预防</h1>
  <p class="sub">三个环节串成一条链，三项措施各打断其中一环。最常错的是把「隔离病人」和「戴口罩」放错位置——这张图专治这个。</p>
  <div class="tools">
    <button type="button" class="ghost" id="btnLabel">隐藏标注　L</button>
    <button type="button" class="ghost" id="btnFull">全屏　F</button>
  </div>
</header>

<main>
  <div class="canvas-wrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

window.__APP__ = {"canvas":{"w":1000,"h":660},"legend":[{"color":"#c0392b","text":"病原体 / 传播路径"},{"color":"#2f7d5c","text":"阻断措施"}],"parts":[{"id":"source","name":"传染源","en":"source of infection","only":"能散播病原体的人或动物","desc":"体内有病原体生长繁殖、并能把病原体排出体外的人或动物（病人、病原体携带者、患病动物）。","role":"传染病流行的<b>起点</b>：病原体从这里出来，才能传给下一个人。","warn":"传染源是<b>人或动物</b>，不是病原体。细菌、病毒叫「病原体」，它们不是传染源。"},{"id":"route_air","name":"空气传播","en":"airborne","only":"飞沫、尘埃","desc":"病人咳嗽、打喷嚏、说话时喷出的飞沫，或附着在尘埃上的病原体。","role":"病原体随飞沫进入空气，被健康人吸入而感染。流感、肺结核走这条路。","warn":"戴口罩挡住的是<b>这一环</b>——切断传播途径，不是控制传染源。"},{"id":"route_contact","name":"接触传播","en":"contact","only":"直接或间接接触","desc":"握手、拥抱等直接接触，或接触被污染的物品、用具。","role":"病原体通过皮肤、黏膜的接触面进入健康人体内。","warn":"「勤洗手」防的是接触传播，属于<b>切断传播途径</b>。"},{"id":"route_food","name":"饮食传播","en":"foodborne","only":"食物和水","desc":"被病原体污染的食物、饮用水。","role":"病原体随食物、水进入消化道，引起肠道传染病（如痢疾、霍乱）。","warn":"「不喝生水、饭前便后洗手」都是切断这一环。"},{"id":"crowd","name":"易感人群","en":"susceptible population","only":"缺乏免疫力的人","desc":"对某种传染病缺乏免疫力、容易感染该病的人群。","role":"传染病流行的<b>终点</b>：病原体到达这里，才可能形成新的病人。","warn":"易感是<b>针对某一种病</b>说的。得过麻疹的人对麻疹不易感，但对流感照样易感。"},{"id":"block_source","name":"控制传染源","en":"control the source","only":"隔离、治疗、处理病畜","desc":"把传染源与健康人分开，或消除其传染性。","role":"具体做法：隔离病人、治疗病人、捕杀或处理患病动物、对携带者进行管理。","warn":"「隔离病人」是<b>控制传染源</b>，不是「切断传播途径」——这是本节最高频的错。"},{"id":"block_route","name":"切断传播途径","en":"cut the route","only":"消毒、戴口罩、洗手","desc":"在病原体从传染源到易感人群的路上设卡。","role":"具体做法：消毒、通风、戴口罩、勤洗手、消灭蚊蝇等媒介生物、处理污水垃圾。","warn":"消毒、戴口罩、洗手、通风、灭蚊——这些都属于<b>切断传播途径</b>。"},{"id":"block_crowd","name":"保护易感人群","en":"protect the susceptible","only":"接种疫苗、锻炼身体","desc":"提高易感人群的抵抗力，或让他们不接触病原体。","role":"具体做法：接种疫苗（最重要）、体育锻炼、合理营养、在传染病流行期间避免去人群密集场所。","warn":"「接种疫苗」是<b>保护易感人群</b>，不是「控制传染源」——疫苗打在健康人身上。"}],"routes":[{"id":"air","color":"#c0392b","w":9,"speed":0.85,"part":"route_air","pts":[[186,216],[300,152],[470,128],[640,150],[762,200]]},{"id":"contact","color":"#c0392b","w":9,"speed":0.85,"part":"route_contact","pts":[[192,300],[360,312],[540,322],[720,334],[836,340]]},{"id     S.playing = v;
    var b = document.getElementById("btnPlay");
    if(b){ b.classList.toggle("on", v); b.textContent = v ? "⏸ 暂停流动" : "▶ 播放流动"; }
  }

  panel.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    if(b.hasAttribute("data-go")){ go(+b.getAttribute("data-go")); return; }
    if(b.id === "btnPlay"){ setPlaying(!S.playing); return; }
    if(b.id === "btnPrev"){ go(S.step - 1); return; }
    if(b.id === "btnNext"){ go(S.step + 1); return; }
    if(b.id === "btnBack"){ S.sel = null; renderStep(); return; }
  });

  svg.addEventListener("click", function(e){
    var n = e.target.closest("[data-part],[data-hit]");
    if(!n){ return; }
    S.sel = n.getAttribute("data-part") || n.getAttribute("data-hit");
    renderPart(S.sel);
  });

  var lbBtn = document.getElementById("btnLabel");
  lbBtn.addEventListener("click", function(){
    var off = svg.classList.toggle("hide-lb");
    lbBtn.classList.toggle("off", off);
    lbBtn.textContent = off ? "显示标注　L" : "隐藏标注　L";
  });

  var fullBtn = document.getElementById("btnFull");
  function toggleFull(){
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullBtn.addEventListener("click", toggleFull);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k === " "){ e.preventDefault(); setPlaying(!S.playing); }
    else if(k === "ArrowRight" || k === "ArrowDown"){ e.preventDefault(); go(S.step + 1); }
    else if(k === "ArrowLeft" || k === "ArrowUp"){ e.preventDefault(); go(S.step - 1); }
    else if(k === "Escape" || k === "Backspace"){ S.sel = null; renderStep(); }
    else if(k === "l" || k === "L"){ lbBtn.click(); }
    else if(k === "f" || k === "F"){ toggleFull(); }
    else if(k >= "1" && k <= "9"){
      var idx = +k - 1;
      if(idx < D.steps.length) go(idx);
    }
  });

  go(0);
  setInterval(tick, 30);

  window.__SELFTEST__ = function(){
    var errs = [];
    var W = D.canvas.w, H = D.canvas.h;
    if(!D.steps || D.steps.length < 3) errs.push("步骤应不少于 3 步");
    if(!D.routes || !D.routes.length) errs.push("routes 为空");
    if(!D.parts || !D.parts.length) errs.push("parts 为空");

    var ids = {}, rids = {};
    (D.parts || []).forEach(function(p){
      ids[p.id] = 1;
      if(!p.name || !p.desc || !p.role) errs.push("部位字段缺失: " + p.id);
    });
    (D.routes || []).forEach(function(rt){
      if(rids[rt.id]) errs.push("route id 重复: " + rt.id);
      rids[rt.id] = 1;
      if(!rt.color) errs.push("route 缺少颜色: " + rt.id);
      if(!rt.pts || rt.pts.length < 2) errs.push("route 控制点不足: " + rt.id);
      (rt.pts || []).forEach(function(pt){
        if(pt[0] < 0 || pt[0] > W || pt[1] < 0 || pt[1] > H){
          errs.push("route「" + rt.id + "」有点跑出画布: " + pt[0] + "," + pt[1]);
        }
      });
    });
    (D.shapes || []).forEach(function(s){
      if(s.part && !ids[s.part]) errs.push("shape 引用了未知部位: " + s.part);
    });
    (D.labels || []).forEach(function(l){
      if(l.p && !ids[l.p]) errs.push("label 引用了未知部位: " + l.p);
    });
    D.steps.forEach(function(st, i){
      if(!st.name) errs.push("步骤缺少名称: " + (i + 1));
      (st.routes || []).forEach(function(rid){
        if(!rids[rid]) errs.push("步骤「" + st.name + "」引用了未知路径: " + rid);
      });
      (st.parts || []).forEach(function(pid){
        if(!ids[pid]) errs.push("步骤「" + st.name + "」引用了未知部位: " + pid);
      });
    });
    // 路径必须真的渲染出长度（防退化成一个点）
    Object.keys(routeEls).forEach(function(k){
      var el = routeEls[k];
      if(!el) return;
      var L = el.getTotalLength();
      if(!L || L < 60) errs.push("路径「" + k + "」长度异常: " + Math.round(L || 0));
    });
    if(flow.length === 0 && S.step > 0 && D.steps[S.step].routes && D.steps[S.step].routes.length){
      errs.push("当前步骤配置了路径却没有流动粒子");
    }
    var anyFlow = false;
    D.steps.forEach(function(st){ if(st.routes && st.routes.length) anyFlow = true; });
    if(!anyFlow) errs.push("没有任何步骤配置流动路径");
    if(svg.querySelectorAll("[data-part]").length === 0) errs.push("没有渲染出任何部位");
    return errs;
  };

  if(!window.__QUIET__){
    var e = window.__SELFTEST__();
    if(e.length) console.log("SELFTEST FAIL: " + e.join(" | "));
    else console.log("SELFTEST PASS");
  }
})();
</script>
</body>
</html>
