<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1d2333; --ink2:#4b5468; --muted:#8b93a7;
    --line:#e3e6f0; --brand:#5b5bd6; --soft:#eeedfd;
    --warn:#a8461f; --warnbg:#fff5f0; --warnline:#f6d3c2;
    --ok:#2f6b45; --okbg:#eef7f1; --okline:#cbe5d5;
    --shadow:0 1px 2px rgba(29,35,51,.05),0 10px 30px -20px rgba(29,35,51,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
    height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header{padding:14px 24px 12px; background:#fff; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; gap:14px; font-size:13px}
  .back{
    color:var(--brand); text-decoration:none; font-weight:600;
    border:1px solid #dedcfb; background:var(--soft); border-radius:7px;
    padding:2px 10px; white-space:nowrap;
  }
  .back:hover{background:#e4e3fc}
  .crumb{font-size:13px; color:var(--muted); letter-spacing:.2px}
  h1{font-size:25px; font-weight:700; letter-spacing:-.3px; margin-top:1px}
  .sub{font-size:14px; color:var(--ink2); margin-top:3px}
  .tools{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .seg{display:inline-flex; background:#eef0f7; border-radius:10px; padding:3px}
  .seg button{
    border:0; background:transparent; font:inherit; font-size:14px; font-weight:500;
    color:var(--ink2); padding:6px 15px; border-radius:8px; cursor:pointer;
  }
  .seg button.on{background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(29,35,51,.13)}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 13px; font:inherit; font-size:13.5px; color:var(--ink2); cursor:pointer;
  }
  .ghost:hover{border-color:#c4c9dd; color:var(--ink)}
  main{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) 400px;
    grid-template-rows:minmax(0,1fr);
    gap:16px; padding:16px 20px 8px; min-height:0;
  }
  .canvas-wrap{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:6px; display:flex; min-height:0;
  }
  svg{width:100%; height:100%; display:block; min-height:0}
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:18px 20px 24px; overflow:auto; min-height:0;
  }
  .panel h3{font-size:20px; font-weight:700; letter-spacing:-.2px}
  .panel .step-no{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    background:var(--brand); border-radius:6px; padding:1px 8px; margin-right:7px;
    vertical-align:2px;
  }
  .goal{
    font-size:16px; color:var(--ink2); margin-top:11px;
    background:#f7f7fe; border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0; padding:10px 13px;
  }
  .p-sec{margin-top:14px}
  .p-sec h4{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1.2px; margin-bottom:4px}
  .p-sec p{font-size:16px; color:var(--ink2)}
  .p-sec.warn{background:var(--warnbg); border:1px solid var(--warnline); border-radius:10px; padding:11px 14px}
  .p-sec.warn h4{color:var(--warn)}
  .p-sec.warn p{color:#7d3617}
  .p-sec.ok{background:var(--okbg); border:1px solid var(--okline); border-radius:10px; padding:11px 14px}
  .p-sec.ok h4{color:var(--ok)}
  .p-sec.ok p{color:#2a5c40}
  .ctrl{border-top:1px dashed var(--line); padding-top:13px; margin-top:14px}
  .ctrl:first-of-type{border-top:0; padding-top:0; margin-top:10px}
  .ctrl .lab{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1px; margin-bottom:7px}
  .btns{display:flex; gap:7px; flex-wrap:wrap}
  .btns button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:5px 10px; font:inherit; font-size:13px; color:var(--ink2); cursor:pointer;
    white-space:nowrap;
  }
  .btns button:hover{border-color:#c4c9dd}
  .btns button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:700}
  .empty-note{
    margin-top:14px; background:#fff8f3; border:1px dashed #e6c3a8;
    border-radius:10px; padding:12px 14px;
  }
  .empty-note h4{font-size:12.5px; font-weight:700; color:var(--warn); letter-spacing:1.2px; margin-bottom:4px}
  .empty-note p{font-size:15.5px; color:#7d3617}
  .keys{
    margin-top:16px; padding-top:13px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.9;
  }
  .keys span{display:inline-block; margin-right:12px; white-space:nowrap}
  .keys kbd{
    font-family:Consolas,monospace; font-size:11.5px; background:#f1f2f8;
    border:1px solid #dde0ec; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; color:var(--ink2);
  }
  footer{
    padding:6px 24px 14px; font-size:12.5px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  footer b{color:var(--ink2); font-weight:600}
  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    main{grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) auto}
    .panel{max-height:350px}
    h1{font-size:21px}
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="back" href="../../index.html">← 全部模型</a>
    <span class="crumb">生物 · {{GRADE}} · {{SECTION}}</span>
  </div>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
  <div class="tools">
    <div class="seg" id="kind">
      <button type="button" data-kind="animal" class="on">动物体</button>
      <button type="button" data-kind="plant">植物体</button>
    </div>
    <button type="button" class="ghost" id="btnFull">全屏　F</button>
  </div>
</header>

<main>
  <div class="canvas-wrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

<footer>
  <span><b>教材位置</b>　{{GRADE}} · {{SECTION}}</span>
  <span><b>课标要求</b>　{{LEVEL}}</span>
  <span><b>建议用时</b>　{{DURATION}}</span>
</footer>

<script>
window.__APP__ = {{DATA}};
(function(){
  "use strict";
  var D = window.__APP__;
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("cv");
  var panel = document.getElementById("panel");
  var S = { kind: "animal", level: 0 };
  var SVGPAD = 34;   // 场景整体下移，避开顶部层级链

  svg.setAttribute("viewBox", "0 0 " + D.canvas.w + " " + (D.canvas.h + SVGPAD));

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    if(a){ for(var k in a){ if(a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); } }
    return e;
  }

  function shape(s){
    var node = null;
    if(s.g){
      node = mk("g", s.tr ? {transform:"translate(" + s.tr[0] + "," + s.tr[1] + ")"} : null);
      s.g.forEach(function(c){ var n = shape(c); if(n) node.appendChild(n); });
      return node;
    }
    if(s.t === "rect"){
      node = mk("rect", {x:s.x, y:s.y, width:s.w, height:s.h, rx:s.rx||0,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
    } else if(s.t === "ellipse"){
      node = mk("ellipse", {cx:s.cx, cy:s.cy, rx:s.rx, ry:s.ry,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
      if(s.rot) node.setAttribute("transform","rotate(" + s.rot + " " + s.cx + " " + s.cy + ")");
    } else if(s.t === "circle"){
      node = mk("circle", {cx:s.cx, cy:s.cy, r:s.r,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
    } else if(s.t === "path"){
      node = mk("path", {d:s.d, fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0,
        "stroke-linecap":s.cap||"butt", "stroke-linejoin":"round"});
      if(s.dash) node.setAttribute("stroke-dasharray", s.dash);
    } else if(s.t === "line"){
      node = mk("line", {x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2,
        stroke:s.stroke||"none", "stroke-width":s.sw||1, "stroke-linecap":s.cap||"butt"});
      node.setAttribute("fill","none");
      if(s.dash) node.setAttribute("stroke-dasharray", s.dash);
    } else if(s.t === "text"){
      node = mk("text", {x:s.x, y:s.y, "font-size":s.size||15, fill:s.fill||"#1d2333",
        "text-anchor":s.anchor||"middle", "dominant-baseline":"middle", "font-weight":s.weight||400});
      node.textContent = s.tx;
    }
    return node;
  }

  function buildChain(ch){
    var g = mk("g", {"class":"chain"});
    var x0 = 30, w = 150, gap = 25, y = 44, h = 54;
    ch.levels.forEach(function(lv, i){
      var x = x0 + i * (w + gap);
      var on = i === S.level;
      var isGap = !!lv.empty;
      var rect = mk("rect", {
        x:x, y:y, width:w, height:h, rx:11,
        fill: isGap ? "#fdfaf7" : (on ? "#eeedfd" : "#f7f8fc"),
        stroke: isGap ? "#e2c9b5" : (on ? "#c9c3f5" : "#e3e6f0"),
        "stroke-width": on ? 2 : 1.2
      });
      if(isGap) rect.setAttribute("stroke-dasharray", "5 4");
      var grp = mk("g", {"class":"lv", "data-lv": i, style:"cursor:pointer"});
      grp.appendChild(rect);
      var t1 = mk("text", {x:x + w/2, y:y + 20, "font-size":15, "font-weight":700,
        "text-anchor":"middle", "dominant-baseline":"middle",
        fill: isGap ? "#b08968" : (on ? "#4a3fb0" : "#4b5468")});
      t1.textContent = lv.name;
      grp.appendChild(t1);
      var t2 = mk("text", {x:x + w/2, y:y + 39, "font-size":11.5,
        "text-anchor":"middle", "dominant-baseline":"middle",
        fill: isGap ? "#c0a48c" : "#78829a"});
      t2.textContent = isGap ? "植物没有" : lv.ex;
      grp.appendChild(t2);
      g.appendChild(grp);

      if(i < ch.levels.length - 1){
        var ax = x + w + 4, ax2 = x + w + gap - 4;
        var ln = mk("line", {x1:ax, y1:y + h/2, x2:ax2, y2:y + h/2,
          stroke:"#c3cadb", "stroke-width":2});
        ln.setAttribute("fill","none");
        g.appendChild(ln);
        var tri = mk("path", {d:"M " + (ax2-5) + " " + (y+h/2-4) + " L " + (ax2+1) + " " + (y+h/2)
          + " L " + (ax2-5) + " " + (y+h/2+4) + " Z", fill:"#c3cadb"});
        g.appendChild(tri);
      }
    });
    return g;
  }

  function txt(x, y, s, size, fill, weight){
    var t = mk("text", {x:x, y:y, "font-size":size, fill:fill,
      "text-anchor":"middle", "dominant-baseline":"middle", "font-weight":weight||400});
    t.textContent = s;
    return t;
  }

  function buildScene(){
    var ch = D.chains[S.kind];
    var lv = ch.levels[S.level];
    var g = mk("g", {"class":"scene", "transform":"translate(0," + SVGPAD + ")"});

    if(lv.empty){
      g.appendChild(mk("rect", {x:250, y:170, width:400, height:250, rx:18,
        fill:"#fdfaf7", stroke:"#e2c9b5", "stroke-width":2, "stroke-dasharray":"9 7"}));
      g.appendChild(txt(450, 258, "×", 76, "#dcc3ae", 700));
      g.appendChild(txt(450, 330, "植物没有「系统」这一层", 22, "#b08968", 700));
      g.appendChild(txt(450, 368, "器官直接构成植物体", 14, "#c0a48c", 400));
    } else {
      var s = lv.scale || 1;
      var art = mk("g", {});
      if(s !== 1){
        art.setAttribute("transform", "translate(" + (450 * (1 - s)) + "," + (300 * (1 - s))
          + ") scale(" + s + ")");
      }
      (lv.shapes || []).forEach(function(sh){ var n = shape(sh); if(n) art.appendChild(n); });
      if(lv.pointer){
        var p = lv.pointer;
        art.appendChild(mk("circle", {cx:p[0], cy:p[1], r:p[2], fill:"none",
          stroke:"#e08a4a", "stroke-width":2.4, "stroke-dasharray":"7 6"}));
      }
      g.appendChild(art);
    }

    var cap = mk("text", {x:450, y:520, "font-size":14.5, fill:"#6b7488",
      "text-anchor":"middle", "dominant-baseline":"middle"});
    cap.textContent = lv.caption || "";
    g.appendChild(cap);

    return g;
  }

  function render(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(buildChain(D.chains[S.kind]));
    svg.appendChild(buildScene());
  }

  function renderPanel(){
    var ch = D.chains[S.kind];
    var lv = ch.levels[S.level];
    var h = '<h3><span class="step-no">' + (S.level + 1) + '</span>' + lv.name + '</h3>';
    if(lv.empty){
      h += '<div class="empty-note"><h4>这一层是空的</h4><p>' + lv.lead + '</p></div>';
      if(lv.note) h += '<div class="p-sec warn"><h4>关键区别</h4><p>' + lv.note + '</p></div>';
    } else {
      h += '<p class="goal">' + lv.lead + '</p>';
      if(lv.note) h += '<div class="p-sec warn"><h4>易错点</h4><p>' + lv.note + '</p></div>';
      if(lv.takeaway) h += '<div class="p-sec ok"><h4>记住这一句</h4><p>' + lv.takeaway + '</p></div>';
    }

    h += '<div class="ctrl"><div class="lab">跳到层级</div><div class="btns">'
      + ch.levels.map(function(x, i){
          return '<button type="button" data-lv="' + i + '" class="' + (S.level === i ? "on" : "") + '">'
            + (i+1) + ". " + x.name + '</button>';
        }).join("")
      + '</div></div>';

    h += '<div class="keys"><span><kbd>1</kbd>~<kbd>5</kbd> 切层级</span>'
      + '<span><kbd>A</kbd> 动物</span><span><kbd>P</kbd> 植物</span>'
      + '<span><kbd>←</kbd><kbd>→</kbd> 上一级 / 下一级</span><span><kbd>F</kbd> 全屏</span></div>';
    panel.innerHTML = h;
  }

  function fullRender(){ render(); renderPanel(); }

  function go(i){
    var n = D.chains[S.kind].levels.length;
    S.level = Math.max(0, Math.min(n - 1, i));
    fullRender();
  }

  function setKind(k){
    S.kind = k;
    S.level = 0;
    var bs = document.querySelectorAll("#kind button");
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-kind") === k);
    fullRender();
  }

  svg.addEventListener("click", function(e){
    var n = e.target.closest("[data-lv]");
    if(n) go(+n.getAttribute("data-lv"));
  });

  document.getElementById("kind").addEventListener("click", function(e){
    var b = e.target.closest("button[data-kind]");
    if(b) setKind(b.getAttribute("data-kind"));
  });

  panel.addEventListener("click", function(e){
    var b = e.target.closest("button[data-lv]");
    if(b) go(+b.getAttribute("data-lv"));
  });

  var fullBtn = document.getElementById("btnFull");
  function toggleFull(){
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullBtn.addEventListener("click", toggleFull);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k >= "1" && k <= "5") go(+k - 1);
    else if(k === "ArrowRight") go(S.level + 1);
    else if(k === "ArrowLeft") go(S.level - 1);
    else if(k === "a" || k === "A") setKind("animal");
    else if(k === "p" || k === "P") setKind("plant");
    else if(k === "f" || k === "F") toggleFull();
  });

  fullRender();

  window.__SELFTEST__ = function(){
    var errs = [];
    ["animal","plant"].forEach(function(k){
      var ch = D.chains[k];
      if(!ch) { errs.push("缺少链条: " + k); return; }
      if(!ch.levels || ch.levels.length !== 5) errs.push(k + " 层级应为 5 个槽位");
      ch.levels.forEach(function(lv, i){
        if(!lv.name) errs.push(k + " 第 " + (i+1) + " 层缺少名称");
        if(lv.empty) return;
        if(!lv.shapes || !lv.shapes.length) errs.push(k + " 第 " + (i+1) + " 层没有图形");
        if(!lv.lead) errs.push(k + " 第 " + (i+1) + " 层缺少说明");
      });
    });
    var pa = D.chains.animal.levels.map(function(x){ return x.name; }).join(">");
    var pp = D.chains.plant.levels.map(function(x){ return x.name; }).join(">");
    if(pa.indexOf("系统") < 0) errs.push("动物链条缺少系统层");
    if(pp.indexOf("系统") >= 0 && !D.chains.plant.levels[3].empty)
      errs.push("植物第 4 层应标为空的系统层");
    if(!D.chains.animal.levels[4].shapes || !D.chains.animal.levels[4].shapes.length)
      errs.push("动物个体层没有图形");
    if(!D.chains.plant.levels[4].shapes || !D.chains.plant.levels[4].shapes.length)
      errs.push("植物体层没有图形");
    return errs;
  };

  if(!window.__QUIET__){
    var e = window.__SELFTEST__();
    if(e.length) console.log("SELFTEST FAIL: " + e.join(" | "));
    else console.log("SELFTEST PASS");
  }
})();
</script>
</body>
</html>
