<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1d2333; --ink2:#4b5468; --muted:#8b93a7;
    --line:#e3e6f0; --brand:#5b5bd6; --soft:#eeedfd;
    --warn:#a8461f; --warnbg:#fff5f0; --warnline:#f6d3c2;
    --ok:#2f6b45; --okbg:#eef7f1; --okline:#cbe5d5;
    --shadow:0 1px 2px rgba(29,35,51,.05),0 10px 30px -20px rgba(29,35,51,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
    height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header{padding:14px 24px 12px; background:#fff; border-bottom:1px solid var(--line)}
  .topbar{display:flex; align-items:center; gap:14px; font-size:13px}
  .back{
    color:var(--brand); text-decoration:none; font-weight:600;
    border:1px solid #dedcfb; background:var(--soft); border-radius:7px;
    padding:2px 10px; white-space:nowrap;
  }
  .back:hover{background:#e4e3fc}
  .crumb{font-size:13px; color:var(--muted); letter-spacing:.2px}
  h1{font-size:25px; font-weight:700; letter-spacing:-.3px; margin-top:1px}
  .sub{font-size:14px; color:var(--ink2); margin-top:3px}
  .tools{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .seg{display:inline-flex; background:#eef0f7; border-radius:10px; padding:3px; flex-wrap:wrap}
  .seg button{
    border:0; background:transparent; font:inherit; font-size:14px; font-weight:500;
    color:var(--ink2); padding:6px 13px; border-radius:8px; cursor:pointer;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(29,35,51,.13)}
  .ghost{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 13px; font:inherit; font-size:13.5px; color:var(--ink2); cursor:pointer;
  }
  .ghost:hover{border-color:#c4c9dd; color:var(--ink)}
  .ghost.off{background:#f1f2f8; color:var(--muted)}
  main{
    flex:1; display:grid; grid-template-columns:minmax(0,1fr) 400px;
    grid-template-rows:minmax(0,1fr);
    gap:16px; padding:16px 20px 8px; min-height:0;
  }
  .canvas-wrap{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:6px; display:flex; min-height:0;
  }
  svg{width:100%; height:100%; display:block; min-height:0}
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:18px 20px 24px; overflow:auto; min-height:0;
  }
  .panel h3{font-size:20px; font-weight:700; letter-spacing:-.2px}
  .panel .en{display:block; font-size:12.5px; color:var(--muted); font-style:italic; margin-top:1px}
  .panel .tag{
    display:inline-block; font-size:12px; font-weight:600; color:var(--brand);
    background:var(--soft); border:1px solid #dedcfb; border-radius:6px;
    padding:1px 8px; margin-top:7px;
  }
  .p-sec{margin-top:15px}
  .p-sec h4{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1.2px; margin-bottom:4px}
  .p-sec p{font-size:16px; color:var(--ink2)}
  .p-sec.warn{background:var(--warnbg); border:1px solid var(--warnline); border-radius:10px; padding:11px 14px}
  .p-sec.warn h4{color:var(--warn)}
  .p-sec.warn p{color:#7d3617}
  .p-sec.ok{background:var(--okbg); border:1px solid var(--okline); border-radius:10px; padding:11px 14px}
  .p-sec.ok h4{color:var(--ok)}
  .p-sec.ok p{color:#2a5c40}
  .hero p.goal{
    font-size:16px; color:var(--ink2); margin-top:10px;
    background:#f7f7fe; border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0; padding:10px 13px;
  }
  .hero p.goal b{color:var(--ink)}
  .hero .tips{margin:14px 0 0 20px; font-size:14.5px; color:var(--ink2)}
  .hero .tips li{margin-bottom:6px}
  .ctrl{border-top:1px dashed var(--line); padding-top:13px; margin-top:14px}
  .ctrl:first-of-type{border-top:0; padding-top:0; margin-top:8px}
  .ctrl .lab{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:1px; margin-bottom:7px}
  .btns{display:flex; gap:7px; flex-wrap:wrap}
  .btns button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:6px 12px; font:inherit; font-size:14px; color:var(--ink2); cursor:pointer;
  }
  .btns button:hover{border-color:#c4c9dd}
  .btns button.on{background:var(--soft); border-color:#c9c3f5; color:var(--brand); font-weight:600}
  .hint{font-size:13.5px; color:var(--ink2); margin-top:9px; line-height:1.55}
  .hint b{color:var(--ink)}
  .legend{display:flex; flex-wrap:wrap; gap:7px 14px}
  .legend .lg{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink2)}
  .legend .lg i{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .keys{
    margin-top:16px; padding-top:13px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.9;
  }
  .keys span{display:inline-block; margin-right:12px; white-space:nowrap}
  .keys kbd{
    font-family:Consolas,monospace; font-size:11.5px; background:#f1f2f8;
    border:1px solid #dde0ec; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; color:var(--ink2);
  }
  footer{
    padding:6px 24px 14px; font-size:12.5px; color:var(--muted);
    display:flex; gap:18px; flex-wrap:wrap;
  }
  footer b{color:var(--ink2); font-weight:600}
  [data-part]{cursor:pointer; transition:opacity .18s}
  [data-part]:hover{opacity:.82}
  svg.hide-lb .lb{display:none}
  .flow{stroke-dasharray:7 7; animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @media (prefers-reduced-motion: reduce){ .flow{animation:none} }
  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    main{grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) auto}
    .panel{max-height:340px}
    h1{font-size:21px}
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="back" href="../../index.html">← 全部模型</a>
    <span class="crumb">生物 · {{GRADE}} · {{SECTION}}</span>
  </div>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
  <div class="tools">
    <div class="seg" id="mode">
      <button type="button" data-mode="transport" class="on">① 物质进出</button>
      <button type="button" data-mode="energy">② 能量转换</button>
      <button type="button" data-mode="clone">③ 细胞核控制</button>
    </div>
    <button type="button" class="ghost" id="btnLabel">隐藏标注　L</button>
    <button type="button" class="ghost" id="btnFull">全屏　F</button>
  </div>
</header>

<main>
  <div class="canvas-wrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

<footer>
  <span><b>教材位置</b>　{{GRADE}} · {{SECTION}}</span>
  <span><b>课标要求</b>　{{LEVEL}}</span>
  <span><b>建议用时</b>　{{DURATION}}</span>
</footer>

<script>
window.__APP__ = {{DATA}};
(function(){
  "use strict";
  var D = window.__APP__;
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("cv");
  var panel = document.getElementById("panel");
  var S = { mode: "transport", playing: true, step: 0 };

  svg.setAttribute("viewBox", "0 0 " + D.canvas.w + " " + D.canvas.h);

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    if(a){ for(var k in a){ if(a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); } }
    return e;
  }

  function shape(s){
    var node = null;
    if(s.g){
      node = mk("g", s.tr ? {transform:"translate(" + s.tr[0] + "," + s.tr[1] + ")"} : null);
      if(s.rot) node.setAttribute("transform", "translate(" + s.tr[0] + "," + s.tr[1] + ") rotate(" + s.rot + ")");
      s.g.forEach(function(c){ var n = shape(c); if(n) node.appendChild(n); });
      return node;
    }
    if(s.t === "rect"){
      node = mk("rect", {x:s.x, y:s.y, width:s.w, height:s.h, rx:s.rx||0,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
    } else if(s.t === "ellipse"){
      node = mk("ellipse", {cx:s.cx, cy:s.cy, rx:s.rx, ry:s.ry,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
      if(s.rot) node.setAttribute("transform","rotate(" + s.rot + " " + s.cx + " " + s.cy + ")");
    } else if(s.t === "circle"){
      node = mk("circle", {cx:s.cx, cy:s.cy, r:s.r,
        fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
    } else if(s.t === "path"){
      node = mk("path", {d:s.d, fill:s.fill||"none", stroke:s.stroke||"none", "stroke-width":s.sw||0});
    } else if(s.t === "line"){
      node = mk("line", {x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2,
        stroke:s.stroke||"none", "stroke-width":s.sw||1});
      node.setAttribute("fill","none");
      if(s.dash){ node.setAttribute("stroke-dasharray", s.dash); node.setAttribute("class","flow"); }
      if(s.marker){ node.setAttribute("marker-end","url(#arw)"); }
    } else if(s.t === "text"){
      node = mk("text", {x:s.x, y:s.y, "font-size":s.size||15, fill:s.fill||"#1d2333",
        "text-anchor":s.anchor||"middle", "dominant-baseline":"middle", "font-weight":s.weight||400});
      node.textContent = s.tx;
    }
    return node;
  }

  var particles = [];
  var partLayer = null;

  function buildScene(scene){
    var g = mk("g", {});
    var defs = mk("defs", {});
    var marker = mk("marker", {id:"arw", viewBox:"0 0 10 10", refX:"8", refY:"5",
      markerWidth:"6", markerHeight:"6", orient:"auto-start-reverse"});
    var mp = mk("path", {d:"M2 1L8 5L2 9", fill:"none", stroke:"context-stroke",
      "stroke-width":"1.5", "stroke-linecap":"round", "stroke-linejoin":"round"});
    marker.appendChild(mp);
    defs.appendChild(marker);
    g.appendChild(defs);

    (scene.shapes || []).forEach(function(s){
      var n = shape(s);
      if(!n) return;
      if(s.part) n.setAttribute("data-part", s.part);
      if(s.step !== undefined) n.setAttribute("data-step", s.step);
      g.appendChild(n);
    });

    if(scene.particles){
      partLayer = mk("g", {"class":"parts-layer"});
      g.appendChild(partLayer);
      initParticles(scene.particles);
    } else {
      partLayer = null;
      particles = [];
    }

    (scene.labels || []).forEach(function(L){
      var lg = mk("g", {"class":"lb"});
      if(L.part) lg.setAttribute("data-part", L.part);
      var ln = mk("line", {x1:L.from[0], y1:L.from[1], x2:L.to[0], y2:L.to[1],
        stroke:"#a4acc0", "stroke-width":1, "stroke-dasharray":"3 3"});
      ln.setAttribute("fill","none");
      lg.appendChild(ln);
      lg.appendChild(mk("circle", {cx:L.to[0], cy:L.to[1], r:3.2, fill:"#7b8497"}));
      var t = mk("text", {x:L.from[0] + (L.anchor === "end" ? -5 : 5), y:L.from[1],
        "font-size":14, fill:"#3c465c", "text-anchor":L.anchor||"end",
        "dominant-baseline":"middle", "font-weight":500});
      t.textContent = L.text;
      lg.appendChild(t);
      g.appendChild(lg);
    });

    return g;
  }

  function seedRand(n){
    var x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function initParticles(cfg){
    particles = [];
    partLayer.innerHTML = "";
    var cx = cfg.center[0], cy = cfg.center[1], R = cfg.radius;
    var idx = 0;
    Object.keys(cfg.types).forEach(function(key){
      var t = cfg.types[key];
      for(var i=0;i<t.n;i++){
        idx++;
        var a = seedRand(idx*3.1 + i) * Math.PI * 2;
        var rr = seedRand(idx*7.7 + i*5) * 0.86 + 0.18;
        var dist = t.pass ? rr * R * 1.55 : (1.12 + rr * 0.42) * R;
        var x = cx + Math.cos(a) * dist;
        var y = cy + Math.sin(a) * dist * 0.96;
        var sp = 0.9 + seedRand(idx*11.3 + i*3) * 0.9;
        var dir = seedRand(idx*5.9 + i*9) * Math.PI * 2;
        var p = {
          key: key, t: t, x: x, y: y,
          vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp
        };
        var el = mk("circle", {cx:x, cy:y, r:t.r, fill:t.color, opacity:t.pass ? 0.92 : 1});
        if(!t.pass){
          el.setAttribute("stroke", "#ffffff");
          el.setAttribute("stroke-width", "1.5");
        }
        partLayer.appendChild(el);
        p.el = el;
        particles.push(p);
      }
    });
  }

  function stepParticles(){
    if(!partLayer) return;
    var cfg = D.scenes[S.mode].particles;
    var cx = cfg.center[0], cy = cfg.center[1], R = cfg.radius;
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;

      if(p.x < 40){ p.x = 40; p.vx = Math.abs(p.vx); }
      if(p.x > D.canvas.w - 40){ p.x = D.canvas.w - 40; p.vx = -Math.abs(p.vx); }
      if(p.y < 40){ p.y = 40; p.vy = Math.abs(p.vy); }
      if(p.y > D.canvas.h - 40){ p.y = D.canvas.h - 40; p.vy = -Math.abs(p.vy); }

      var dx = p.x - cx, dy = p.y - cy;
      var d = Math.sqrt(dx*dx + dy*dy);
      var band = R + 9;
      if(!p.t.pass && Math.abs(d - band) < 10){
        var nx = dx / (d || 1), ny = dy / (d || 1);
        var dot = p.vx * nx + p.vy * ny;
        p.vx -= 2 * dot * nx;
        p.vy -= 2 * dot * ny;
        var push = d > band ? 11 : -11;
        p.x = cx + nx * (band + push);
        p.y = cy + ny * (band + push);
      }
      p.el.setAttribute("cx", p.x.toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
    }
  }

  function loop(){
    if(S.mode === "transport" && S.playing) stepParticles();
  }

  function render(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(buildScene(D.scenes[S.mode]));
    if(S.mode === "clone") applyStep();
    if(svg.classList.contains("hide-lb")) svg.classList.add("hide-lb");
  }

  function applyStep(){
    var ns = svg.querySelectorAll("[data-step]");
    for(var i=0;i<ns.length;i++){
      var on = +ns[i].getAttribute("data-step") === S.step + 1;
      ns[i].setAttribute("opacity", on ? "1" : "0.36");
      ns[i].style.transition = "opacity .25s";
    }
  }

  function legendHtml(){
    var sc = D.scenes[S.mode];
    if(!sc.legend) return "";
    return '<div class="ctrl"><div class="lab">图例</div><div class="legend">'
      + sc.legend.map(function(x){
          return '<span class="lg"><i style="background:' + x.color + '"></i>' + x.text + '</span>';
        }).join("")
      + '</div></div>';
  }

  function controls(){
    if(S.mode === "transport"){
      return '<div class="ctrl"><div class="lab">播放</div><div class="btns">'
        + '<button type="button" id="btnPlay" class="' + (S.playing ? "on" : "") + '">'
        + (S.playing ? "⏸ 暂停" : "▶ 播放") + '</button>'
        + '<button type="button" id="btnReset">重置位置</button></div>'
        + '<div class="hint">暂停后可以指着某一颗粒子讲——比如那颗红色的，为什么一直进不去。</div></div>';
    }
    if(S.mode === "clone"){
      return '<div class="ctrl"><div class="lab">操作步骤</div><div class="btns">'
        + ['① 取卵去核','② 植入细胞核','③ 培养成胚胎','④ 植入代孕羊'].map(function(x, i){
            return '<button type="button" data-step="' + (i+1) + '" class="' + (S.step === i ? "on" : "") + '">' + x + '</button>';
          }).join("")
        + '</div><div class="hint">' + D.scenes.clone.steps[S.step].detail + '</div></div>';
    }
    return "";
  }

  function renderPanel(){
    var sc = D.scenes[S.mode];
    var h = '<h3>' + sc.title + '</h3>';
    if(sc.lead) h += '<p class="goal">' + sc.lead + '</p>';
    h += controls() + legendHtml();
    if(sc.note) h += '<div class="p-sec warn"><h4>易错点</h4><p>' + sc.note + '</p></div>';
    if(sc.takeaway) h += '<div class="p-sec ok"><h4>记住这一句</h4><p>' + sc.takeaway + '</p></div>';
    h += '<div class="keys"><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切视图</span>'
      + '<span><kbd>L</kbd> 标注</span><span><kbd>F</kbd> 全屏</span>'
      + (S.mode === "transport" ? '<span><kbd>空格</kbd> 播放暂停</span>' : '')
      + '</div>';
    panel.innerHTML = h;
  }

  function setMode(m){
    S.mode = m;
    if(m === "clone") S.step = 0;
    var bs = document.querySelectorAll("#mode button");
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-mode") === m);
    render(); renderPanel();
  }

  document.getElementById("mode").addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]");
    if(b) setMode(b.getAttribute("data-mode"));
  });

  panel.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    if(b.id === "btnPlay"){
      S.playing = !S.playing;
      b.classList.toggle("on", S.playing);
      b.textContent = S.playing ? "⏸ 暂停" : "▶ 播放";
      return;
    }
    if(b.id === "btnReset"){ initParticles(D.scenes.transport.particles); return; }
    if(b.hasAttribute("data-step")){
      S.step = +b.getAttribute("data-step") - 1;
      var all = panel.querySelectorAll("button[data-step]");
      for(var i=0;i<all.length;i++) all[i].classList.toggle("on", +all[i].getAttribute("data-step") === S.step + 1);
      var hint = panel.querySelector(".hint");
      if(hint) hint.innerHTML = D.scenes.clone.steps[S.step].detail;
      applyStep();
    }
  });

  var lbBtn = document.getElementById("btnLabel");
  lbBtn.addEventListener("click", function(){
    var off = svg.classList.toggle("hide-lb");
    lbBtn.classList.toggle("off", off);
    lbBtn.textContent = off ? "显示标注　L" : "隐藏标注　L";
  });

  var fullBtn = document.getElementById("btnFull");
  function toggleFull(){
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  }
  fullBtn.addEventListener("click", toggleFull);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k === "1") setMode("transport");
    else if(k === "2") setMode("energy");
    else if(k === "3") setMode("clone");
    else if(k === " "){
      if(S.mode === "transport"){
        e.preventDefault();
        var b = document.getElementById("btnPlay");
        if(b) b.click();
      }
    }
    else if(k === "l" || k === "L") lbBtn.click();
    else if(k === "f" || k === "F") toggleFull();
  });

  setMode("transport");
  setInterval(loop, 28);

  window.__SELFTEST__ = function(){
    var errs = [];
    var keys = ["transport","energy","clone"];
    keys.forEach(function(k){
      if(!D.scenes[k]) errs.push("缺少场景: " + k);
      else if(!D.scenes[k].shapes || !D.scenes[k].shapes.length) errs.push("场景无图形: " + k);
    });
    ["transport","energy","clone"].forEach(function(k){
      if(!D.scenes[k].title) errs.push("场景缺少标题: " + k);
    });
    if(particles.length === 0) errs.push("物质进出场景没有粒子");
    var cfg = D.scenes.transport.particles;
    if(cfg){
      Object.keys(cfg.types).forEach(function(key){
        if(!cfg.types[key].color) errs.push("粒子缺少颜色: " + key);
        if(cfg.types[key].n < 1) errs.push("粒子数量异常: " + key);
      });
      var blocked = 0;
      particles.forEach(function(p){
        var dx = p.x - cfg.center[0], dy = p.y - cfg.center[1];
        var d = Math.sqrt(dx*dx + dy*dy);
        if(!p.t.pass){
          blocked++;
          if(d < cfg.radius * 0.9) errs.push("不可通过的粒子初始在细胞内: " + p.key);
        }
      });
      if(blocked === 0) errs.push("没有设置不可通过的粒子");
    }
    if(D.scenes.clone && (!D.scenes.clone.steps || D.scenes.clone.steps.length !== 4)){
      errs.push("克隆步骤应为 4 步");
    }
    var stepShapes = (D.scenes.clone.shapes || []).filter(function(x){ return x.step !== undefined; });
    if(stepShapes.length === 0) errs.push("克隆场景没有分步元素");
    return errs;
  };

  if(!window.__QUIET__){
    var e = window.__SELFTEST__();
    if(e.length) console.log("SELFTEST FAIL: " + e.join(" | "));
    else console.log("SELFTEST PASS");
  }
})();
</script>
